<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 5 1200 630" width="1200" height="630" role="img" aria-label="Abysslink — vibe-code Claude from your phone, securely">
  <!-- Open Graph image, 1200x630 (cropped from the social card). Palette locked to internal/ui/theme.go. -->
  <defs>
    <linearGradient id="abyss" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2CE0F5" offset="0"/>
      <stop stop-color="#6E80F7" offset="0.55"/>
      <stop stop-color="#B57BFF" offset="1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.42" r="0.75">
      <stop stop-color="#1a2438" offset="0"/>
      <stop stop-color="#0f1117" offset="1"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2CE0F5" offset="0"/>
      <stop stop-color="#B57BFF" offset="1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <!-- faint rain field -->
  <g stroke="#2CE0F5" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 22" opacity="0.14">
    <path d="M980 40 V240"/><path d="M1060 90 V330"/><path d="M1140 30 V260"/>
    <path d="M1210 110 V350"/><path d="M900 120 V300"/><path d="M1250 40 V180"/>
  </g>
  <!-- mark -->
  <g transform="translate(96,128) scale(0.75)">
    <path d="M256 64 L116 448" fill="none" stroke="url(#abyss)" stroke-width="38" stroke-linecap="round"/>
    <path d="M256 64 L396 448" fill="none" stroke="url(#abyss)" stroke-width="38" stroke-linecap="round"/>
    <g stroke="#2CE0F5" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="3 27">
      <path d="M256 118 V258"/>
      <path d="M224 158 V272" opacity="0.72"/>
      <path d="M288 158 V272" opacity="0.72"/>
      <path d="M196 210 V284" opacity="0.45"/>
      <path d="M316 210 V284" opacity="0.45"/>
    </g>
    <g fill="none" stroke-width="22">
      <rect stroke="#6E80F7" x="148" y="326" width="112" height="62" rx="31"/>
      <rect stroke="#B57BFF" x="252" y="326" width="112" height="62" rx="31"/>
    </g>
  </g>
  <!-- wordmark + copy -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="520" y="268" font-size="92" font-weight="700" fill="url(#wordmark)" letter-spacing="-2">Abysslink</text>
    <text x="522" y="330" font-size="34" fill="#F8F8F2" font-weight="500">Vibe-code Claude from your phone — securely.</text>
    <text x="522" y="382" font-size="25" fill="#8B95A5">Hardened phone-to-laptop control over your own private mesh.</text>
    <text x="522" y="418" font-size="25" fill="#8B95A5">Approve, watch, or kill an AI agent from your pocket.</text>
  </g>
  <!-- trust chips -->
  <g font-family="Menlo, Consolas, monospace" font-size="21">
    <rect x="520" y="462" width="212" height="44" rx="22" fill="none" stroke="#2a2d3a" stroke-width="2"/>
    <text x="546" y="490" fill="#04B575">zero telemetry</text>
    <rect x="748" y="462" width="224" height="44" rx="22" fill="none" stroke="#2a2d3a" stroke-width="2"/>
    <text x="774" y="490" fill="#2CE0F5">signed releases</text>
    <rect x="988" y="462" width="184" height="44" rx="22" fill="none" stroke="#2a2d3a" stroke-width="2"/>
    <text x="1014" y="490" fill="#B57BFF">Apache-2.0</text>
  </g>
  <g font-family="Menlo, Consolas, monospace">
    <text x="520" y="560" font-size="23" fill="#64748B">$ curl -fsSL abysslink.dev/install.sh | sh</text>
  </g>
</svg>
