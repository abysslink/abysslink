version: 2

project_name: abysslink

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: abysslink
    binary: abysslink
    main: ./cmd/abysslink
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/abysslink/abysslink/internal/cli.version={{.Version}}
      - -X github.com/abysslink/abysslink/internal/cli.commit={{.Commit}}
      - -X github.com/abysslink/abysslink/internal/cli.buildDate={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: abysslinkd
    binary: abysslinkd
    main: ./cmd/abysslinkd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/abysslink/abysslink/internal/cli.version={{.Version}}
      - -X github.com/abysslink/abysslink/internal/cli.commit={{.Commit}}
      - -X github.com/abysslink/abysslink/internal/cli.buildDate={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    builds:
      - abysslink
      - abysslinkd
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - NOTICE
      - abysslink.yaml.example

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive
    args: ["$artifact", "--output", "cyclonedx-json@${artifact}.cdx.json"]

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

nfpms:
  - id: packages
    builds:
      - abysslink
      - abysslinkd
    package_name: abysslink
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Abysslink Contributors
    homepage: https://abysslink.dev
    maintainer: Abysslink Contributors <hello@abysslink.dev>
    description: >-
      Automates a paranoid-by-default phone-to-laptop remote-control setup
      over Tailscale. One command to rule them all: abysslink up.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    contents:
      - src: abysslink.yaml.example
        dst: /usr/share/doc/abysslink/abysslink.yaml.example
        type: doc
      - src: LICENSE
        dst: /usr/share/doc/abysslink/LICENSE
        type: doc

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - typo

release:
  github:
    owner: abysslink
    name: abysslink
  draft: true
  prerelease: auto
  name_template: "Abysslink {{.Tag}}"
  footer: |
    ## Verify this release

    Every release is signed with [cosign](https://docs.sigstore.dev/cosign/) keyless signing
    via GitHub Actions OIDC — no private key used or stored.

    ```sh
    VERSION={{ .Tag }}

    # Download cosign artifacts for the checksum manifest
    curl -fsSL https://github.com/abysslink/abysslink/releases/download/${VERSION}/abysslink_${VERSION#v}_checksums.txt     -o checksums.txt
    curl -fsSL https://github.com/abysslink/abysslink/releases/download/${VERSION}/abysslink_${VERSION#v}_checksums.txt.sig -o checksums.txt.sig
    curl -fsSL https://github.com/abysslink/abysslink/releases/download/${VERSION}/abysslink_${VERSION#v}_checksums.txt.pem -o checksums.txt.pem

    # Verify cosign signature
    cosign verify-blob \
      --certificate checksums.txt.pem \
      --signature   checksums.txt.sig \
      --certificate-identity-regexp "https://github.com/abysslink/abysslink/.github/workflows/release.yml@refs/tags/.*" \
      --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      checksums.txt

    # Verify your binary's SHA-256 against the signed manifest
    grep abysslink_${VERSION#v}_linux_amd64.tar.gz checksums.txt | sha256sum --check
    ```

    One-liner installer (runs all of the above automatically):
    ```sh
    curl -fsSL https://raw.githubusercontent.com/abysslink/abysslink/main/install.sh | bash
    ```

    Self-update from an installed binary:
    ```sh
    abysslink upgrade --apply
    ```

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"
