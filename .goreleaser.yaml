version: 2

project_name: abysslink

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: abysslink
    binary: abysslink
    main: ./cmd/abysslink
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/abysslink/abysslink/internal/cli.version={{.Version}}
      - -X github.com/abysslink/abysslink/internal/cli.commit={{.Commit}}
      - -X github.com/abysslink/abysslink/internal/cli.buildDate={{.CommitDate}}
      - -X github.com/abysslink/abysslink/internal/cli.bundleURL=https://github.com/abysslink/abysslink/releases/download/{{.Tag}}/{{.ProjectName}}_{{.Version}}_checksums.txt.bundle
      - -X github.com/abysslink/abysslink/internal/cli.slsaURL=https://github.com/abysslink/abysslink/attestations
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: abysslinkd
    binary: abysslinkd
    main: ./cmd/abysslinkd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/abysslink/abysslink/internal/cli.version={{.Version}}
      - -X github.com/abysslink/abysslink/internal/cli.commit={{.Commit}}
      - -X github.com/abysslink/abysslink/internal/cli.buildDate={{.CommitDate}}
      - -X github.com/abysslink/abysslink/internal/cli.bundleURL=https://github.com/abysslink/abysslink/releases/download/{{.Tag}}/{{.ProjectName}}_{{.Version}}_checksums.txt.bundle
      - -X github.com/abysslink/abysslink/internal/cli.slsaURL=https://github.com/abysslink/abysslink/attestations
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Separate opt-in build that links the Web UI dashboard (Phase 19, WEB-01).
  # Identical to abysslinkd but with `-tags webui`, so the Tailscale SDK is only
  # linked into this artifact — the base abysslinkd binary stays SDK-free (T-19-02).
  - id: abysslinkd-webui
    binary: abysslinkd-webui
    main: ./cmd/abysslinkd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    tags:
      - webui
    ldflags:
      - -s -w
      - -X github.com/abysslink/abysslink/internal/cli.version={{.Version}}
      - -X github.com/abysslink/abysslink/internal/cli.commit={{.Commit}}
      - -X github.com/abysslink/abysslink/internal/cli.buildDate={{.CommitDate}}
      - -X github.com/abysslink/abysslink/internal/cli.bundleURL=https://github.com/abysslink/abysslink/releases/download/{{.Tag}}/{{.ProjectName}}_{{.Version}}_checksums.txt.bundle
      - -X github.com/abysslink/abysslink/internal/cli.slsaURL=https://github.com/abysslink/abysslink/attestations
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids:
      - abysslink
      - abysslinkd
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - NOTICE
      - abysslink.yaml.example

  # Separate archive for the opt-in Web UI daemon variant (WEB-01). Distinct
  # name_template keeps the webui artifact unambiguous alongside the default set.
  - id: webui
    ids:
      - abysslinkd-webui
    name_template: "{{ .ProjectName }}-webui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - NOTICE
      - abysslink.yaml.example

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

sboms:
  - id: spdx
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    args:
      - "${artifact}"
      - "--output"
      - "spdx-json=${document}"
  - id: cyclonedx
    artifacts: archive
    documents:
      - "${artifact}.cdx.json"
    args:
      - "${artifact}"
      - "--output"
      - "cyclonedx-json=${document}"

# NOTE: Cosign signing is intentionally NOT configured here. The single source
# of truth for release signing is the dedicated `sign` job in
# .github/workflows/release.yml, which runs `cosign sign-blob --bundle` against
# the checksum manifest with `id-token: write` for keyless OIDC signing. The
# release workflow invokes goreleaser with `--skip=sign`, so a `signs:` block
# here would be dead config that diverges from what actually ships.

nfpms:
  - id: packages
    ids:
      - abysslink
      - abysslinkd
    package_name: abysslink
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Abysslink Contributors
    homepage: https://abysslink.dev
    maintainer: Abysslink Contributors <hello@abysslink.dev>
    description: >-
      Automates a paranoid-by-default phone-to-laptop remote-control setup
      over Tailscale. One command to rule them all: abysslink up.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    contents:
      - src: abysslink.yaml.example
        dst: /usr/share/doc/abysslink/abysslink.yaml.example
        type: doc
      - src: LICENSE
        dst: /usr/share/doc/abysslink/LICENSE
        type: doc

# NOTE: The abysslink/homebrew-tap GitHub repo and the HOMEBREW_TAP_GITHUB_TOKEN secret
# must be provisioned by an operator before tagging a release (see LAUNCH.md §Pre-steps).
# skip_upload is PINNED true: goreleaser runs inside the build job, BEFORE the
# sign/verify/publish gates, and a cask pushed while the release is still a
# draft points at releases/download URLs that 404 — permanently if a gate
# fails. goreleaser therefore only renders the cask into dist/; the
# publish-packages job in release.yml pushes it to the tap AFTER the release
# is public (and skips gracefully while the token is unprovisioned).
homebrew_casks:
  - name: abysslink
    ids:
      - default
    binaries:
      - abysslink
      - abysslinkd
    description: >-
      Paranoid-by-default phone-to-laptop remote-control setup over Tailscale
    homepage: https://abysslink.dev
    # Gatekeeper quarantine-removal hook: fallback until Developer ID signing clears.
    # Remove this hooks block entirely when Developer ID signing is active.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "#{staged_path}/abysslink"]
            system_command "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "#{staged_path}/abysslinkd"]
          end
    generate_completions_from_executable:
      # The default archive stages binaries at the archive ROOT (no bin/ dir and
      # no wrap_in_directory), matching the quarantine hook's "#{staged_path}/abysslink".
      # A "bin/abysslink" path here makes Homebrew's completion generation ENOENT
      # and silently ship no completions.
      executable: "abysslink"
      args:
        - completion
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish
    repository:
      owner: abysslink
      name: homebrew-tap
      branch: main
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    commit_author:
      name: goreleaserbot
      email: hello@abysslink.dev
    skip_upload: true

# NOTE: The AUR abysslink-bin package and AUR_SSH_PRIVATE_KEY secret must be provisioned
# by an operator before tagging a release (see LAUNCH.md §Pre-steps).
# Same gate contract as homebrew_casks above: skip_upload PINNED true, the
# PKGBUILD/.SRCINFO are only rendered into dist/ here and pushed by
# release.yml's publish-packages job after the publish gate.
aurs:
  - name: abysslink-bin
    ids:
      - default
    homepage: https://abysslink.dev
    description: >-
      Paranoid-by-default phone-to-laptop remote-control setup over Tailscale
    maintainers:
      - "Abysslink Contributors <hello at abysslink dot dev>"
    license: Apache-2.0
    git_url: "ssh://aur@aur.archlinux.org/abysslink-bin.git"
    private_key: '{{ index .Env "AUR_SSH_PRIVATE_KEY" }}'
    provides:
      - abysslink
    conflicts:
      - abysslink
    depends:
      - glibc
    package: |-
      install -Dm755 "./abysslink" "${pkgdir}/usr/bin/abysslink"
      install -Dm755 "./abysslinkd" "${pkgdir}/usr/bin/abysslinkd"
      install -Dm644 "./LICENSE" \
        "${pkgdir}/usr/share/licenses/abysslink-bin/LICENSE"
      install -Dm644 "./abysslink.yaml.example" \
        "${pkgdir}/usr/share/doc/abysslink/abysslink.yaml.example"
    commit_msg_template: "chore: update to {{ .Tag }}"
    commit_author:
      name: goreleaserbot
      email: hello@abysslink.dev
    skip_upload: true

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - typo

release:
  github:
    owner: abysslink
    name: abysslink
  draft: true
  # A failed sign/verify gate strands a draft; without this, re-tagging would
  # create a SECOND draft with the same title (GetReleaseByTag never returns
  # drafts) and the gh-by-tag fallbacks in sign/publish could race the stale
  # one. Replacing the prior draft makes tag re-push a safe, documented
  # recovery path (LAUNCH.md §Release recovery).
  replace_existing_draft: true
  prerelease: auto
  name_template: "Abysslink {{.Tag}}"
  footer: |
    ## Verify this release

    Every release is signed with [cosign](https://docs.sigstore.dev/cosign/) keyless signing
    via GitHub Actions OIDC — no private key used or stored.

    ```sh
    VERSION={{ .Tag }}

    # Download the checksum manifest and its cosign v3 bundle
    curl -fsSL https://github.com/abysslink/abysslink/releases/download/${VERSION}/abysslink_${VERSION#v}_checksums.txt        -o checksums.txt
    curl -fsSL https://github.com/abysslink/abysslink/releases/download/${VERSION}/abysslink_${VERSION#v}_checksums.txt.bundle -o checksums.txt.bundle

    # Verify cosign signature (offline — the bundle embeds the cert chain + Rekor proof)
    cosign verify-blob \
      --bundle checksums.txt.bundle \
      --offline \
      --certificate-identity-regexp "^https://github\.com/abysslink/abysslink/\.github/workflows/release\.yml@refs/tags/.*$" \
      --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      checksums.txt

    # Verify your binary's SHA-256 against the signed manifest.
    # The trailing space+anchor keeps the match to the tarball line itself —
    # an unanchored grep also matches the .cdx.json/.spdx.json SBOM lines,
    # which you haven't downloaded, and sha256sum then reports phantom
    # failures. (macOS: use `shasum -a 256 --check`.)
    grep " abysslink_${VERSION#v}_linux_amd64.tar.gz$" checksums.txt | sha256sum --check
    ```

    One-liner installer (runs all of the above automatically):
    ```sh
    curl -fsSL https://raw.githubusercontent.com/abysslink/abysslink/main/install.sh | bash
    ```

    Self-update from an installed binary:
    ```sh
    abysslink upgrade --apply
    ```

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"
