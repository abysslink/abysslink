name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: "Test on ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
          # TODO(CI-01): Promote to egress-policy: block after observing which extra endpoints
          # macOS-latest runners require. ubuntu-latest is already precedent in security.yml/fuzz.yml.
          # Step: review harden-runner audit logs from macOS runs, add any missing endpoints to
          # allowed-endpoints, then flip egress-policy to block.
          allowed-endpoints: >
            golang.org:443
            proxy.golang.org:443
            sum.golang.org:443
            dl.google.com:443
            go.dev:443
            storage.googleapis.com:443
            objects.googleapis.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
          cache: true

      # Point TMPDIR at the runner's scratch space. The default /tmp is not
      # writable for t.TempDir() on the Linux runner (mkdir: permission denied),
      # and its path is too long for the macOS 104-char unix-socket limit that
      # the daemon status tests hit. runner.temp is writable and short on both.
      - name: Run tests
        run: make test
        env:
          TMPDIR: ${{ runner.temp }}
