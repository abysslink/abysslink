name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: "Test on ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          # TODO(CI-01): Promote to egress-policy: block after observing which extra endpoints
          # macOS-latest runners require. ubuntu-latest is already precedent in security.yml/fuzz.yml.
          # Step: review harden-runner audit logs from macOS runs, add any missing endpoints to
          # allowed-endpoints, then flip egress-policy to block.
          allowed-endpoints: >
            golang.org:443
            proxy.golang.org:443
            sum.golang.org:443
            dl.google.com:443
            go.dev:443
            storage.googleapis.com:443
            objects.googleapis.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      # Point TMPDIR at the runner's scratch space. The default /tmp is not
      # writable for t.TempDir() on the Linux runner (mkdir: permission denied),
      # and its path is too long for the macOS 104-char unix-socket limit that
      # the daemon status tests hit. runner.temp is writable and short on both.
      - name: Run tests
        run: make test
        env:
          TMPDIR: ${{ runner.temp }}
