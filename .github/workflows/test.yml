name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: "Test on ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # Point TMPDIR at the runner's scratch space. The default /tmp is not
      # writable for t.TempDir() on the Linux runner (mkdir: permission denied),
      # and its path is too long for the macOS 104-char unix-socket limit that
      # the daemon status tests hit. runner.temp is writable and short on both.
      - name: Run tests
        run: make test
        env:
          TMPDIR: ${{ runner.temp }}
