#
# Release dry-run: exercises the goreleaser release path (snapshot mode — no
# publishing, no signing) under the SAME harden-runner egress policy as the
# real release build. Exists because release.yml only triggers on tags, so
# breakage in the release path was historically invisible until a release was
# attempted (v3.0.0 died on token permissions, v3.0.1/v3.0.2 on the egress
# allowlist). This job fails the PR instead.
name: Release Dry-Run

on:
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-build.yml"
      - ".github/workflows/release-dryrun.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dryrun:
    name: goreleaser snapshot (no publish, no sign)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # MUST stay a superset-match of release-build.yml's allowlist (minus
          # the Sigstore endpoints — signing is skipped here): the point of
          # this job is to catch allowlist drift before a tag does.
          allowed-endpoints: >
            api.github.com:443
            uploads.github.com:443
            codeload.github.com:443
            raw.githubusercontent.com:443
            get.anchore.io:443
            toolbox-data.anchore.io:443
            proxy.golang.org:443
            sum.golang.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            goreleaser.com:443
            go.dev:443
            dl.google.com:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # goreleaser needs full history for changelog

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean --snapshot --skip=sign,publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately empty: mirrors a release run where the operator has not
          # provisioned the tap/AUR secrets, proving the skip_upload guards in
          # .goreleaser.yaml keep the pipeline green in that state.
          HOMEBREW_TAP_GITHUB_TOKEN: ""
          AUR_SSH_PRIVATE_KEY: ""

      - name: Assert expected artifacts exist
        run: |
          set -euo pipefail
          ls -l dist/
          # Snapshot version is <next>-SNAPSHOT-<sha>; find the manifest by glob.
          checksums=(dist/abysslink_*_checksums.txt)
          [ -f "${checksums[0]}" ] || { echo "checksum manifest missing"; exit 1; }
          for pattern in linux_amd64.tar.gz linux_arm64.tar.gz darwin_arm64.tar.gz darwin_amd64.tar.gz; do
            compgen -G "dist/*${pattern}" > /dev/null || { echo "missing artifact: ${pattern}"; exit 1; }
          done
          # publish-packages (release.yml) locates these by find — prove the
          # exact lookups on every PR so a goreleaser layout/naming change
          # cannot first surface AFTER a release is public.
          [ -n "$(find dist -name 'abysslink.rb' -print -quit)" ] || { echo "missing generated homebrew cask"; exit 1; }
          [ -n "$(find dist -name '*.pkgbuild' -print -quit)" ]   || { echo "missing generated AUR PKGBUILD"; exit 1; }
          [ -n "$(find dist -name '*.srcinfo' -print -quit)" ]    || { echo "missing generated AUR .SRCINFO"; exit 1; }
          echo "dry-run OK: all release artifacts built"
