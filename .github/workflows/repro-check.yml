#
# Reproducible-build assertion (SCH-06): builds the abysslink binary twice from
# the same checkout and fails if the two binaries are not byte-identical. A
# non-reproducible build means a binary could be substituted without detection.
name: repro-check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # ldflags below mirror .goreleaser.yaml exactly so the binary this gate
      # proves byte-reproducible matches the one that ships:
      #   - commit uses the FULL SHA (goreleaser injects {{.Commit}}), not --short
      #   - buildDate uses the committer date (goreleaser injects {{.CommitDate}})
      # The released artifact additionally carries {{.Tag}}-derived version,
      # bundleURL, and slsaURL — those depend on the release tag and are not
      # reproducible from an arbitrary HEAD, so they are deliberately omitted here.
      - name: Build binary (attempt 1)
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format='%ct')
          export SOURCE_DATE_EPOCH
          mkdir -p build1
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/abysslink/abysslink/internal/cli.version=$(git describe --tags --always) \
              -X github.com/abysslink/abysslink/internal/cli.commit=$(git rev-parse HEAD) \
              -X github.com/abysslink/abysslink/internal/cli.buildDate=$(git log -1 --format='%cI')" \
            -o build1/abysslink ./cmd/abysslink

      - name: Build binary (attempt 2)
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format='%ct')
          export SOURCE_DATE_EPOCH
          mkdir -p build2
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/abysslink/abysslink/internal/cli.version=$(git describe --tags --always) \
              -X github.com/abysslink/abysslink/internal/cli.commit=$(git rev-parse HEAD) \
              -X github.com/abysslink/abysslink/internal/cli.buildDate=$(git log -1 --format='%cI')" \
            -o build2/abysslink ./cmd/abysslink

      - name: Assert byte-identical binaries
        run: |
          hash1=$(sha256sum build1/abysslink | awk '{print $1}')
          hash2=$(sha256sum build2/abysslink | awk '{print $1}')
          echo "Build 1: $hash1"
          echo "Build 2: $hash2"
          if [ "$hash1" != "$hash2" ]; then
            echo "FAIL: binaries differ — reproducible build is broken"
            diff <(xxd build1/abysslink) <(xxd build2/abysslink) | head -40
            exit 1
          fi
          echo "OK: both builds are byte-identical ($hash1)"
