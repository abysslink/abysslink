name: Lint

on:
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            golang.org:443
            proxy.golang.org:443
            sum.golang.org:443
            dl.google.com:443
            go.dev:443
            storage.googleapis.com:443
            objects.googleapis.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      # Build golangci-lint from source with the runner's Go (go-version "1.26"
      # installs the latest manifest patch; GOTOOLCHAIN reaches go.mod's 1.26.4).
      # Prebuilt golangci-lint releases are built with an older Go and refuse to
      # lint a module that targets a newer Go version.
      - name: Install golangci-lint (from source)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Check install.sh copies are in sync
        # Root install.sh serves the short curl URL; scripts/install.sh is
        # canonical. Byte-identical or users get different installers by URL.
        run: cmp install.sh scripts/install.sh
