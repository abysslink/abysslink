name: Lint

on:
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            golang.org:443
            proxy.golang.org:443
            sum.golang.org:443
            dl.google.com:443
            go.dev:443
            storage.googleapis.com:443
            objects.googleapis.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
          cache: true

      # Build golangci-lint from source with the runner's Go (go-version "1.26"
      # installs the latest manifest patch; GOTOOLCHAIN reaches go.mod's 1.26.4).
      # Prebuilt golangci-lint releases are built with an older Go and refuse to
      # lint a module that targets a newer Go version.
      - name: Install golangci-lint (from source)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: golangci-lint run ./...
