name: Lint

on:
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run make lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: ./...
