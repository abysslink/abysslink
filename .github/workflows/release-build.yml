#
# Reusable build + SLSA Build L3 provenance workflow.
#
# This workflow is the L3 isolation boundary: the goreleaser build and the
# `actions/attest-build-provenance` step run inside a callable reusable workflow
# so neither the source under test nor the developer who pushed the tag can
# influence the signing step. Verifying provenance with
# `gh attestation verify --signer-workflow <repo>/.github/workflows/release-build.yml`
# binds trust to THIS exact workflow path (SLSA v1 Build L3).
#
# L3 requires `id-token: write` + `attestations: write` on BOTH this reusable
# job AND the caller job (Pitfall 2). The caller (release.yml) declares them too.
name: Release Build (reusable, SLSA L3)

on:
  workflow_call:
    outputs:
      version:
        description: "The release tag (e.g. v1.2.3) extracted from GITHUB_REF_NAME"
        value: ${{ jobs.build.outputs.version }}

# Deny-all by default; the build job grants only what it needs.
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build, SBOM & SLSA L3 provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # goreleaser runs `release` here: it must CREATE the draft GitHub release
      # and upload the dist assets (v3.0.0 failed with "403 Resource not
      # accessible by integration" under contents: read). The draft is only
      # flipped public by release.yml's `publish` job after sign + verify pass.
      contents: write
      id-token: write      # OIDC for keyless Sigstore provenance signing (L3)
      attestations: write  # publish the SLSA build provenance attestation (L3)
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Build endpoints + Sigstore endpoints required for keyless
          # provenance signing (fulcio cert issuance, rekor transparency log,
          # tuf trust-root refresh).
          # go.dev / dl.google.com / storage.googleapis.com / codeload /
          # release-assets.githubusercontent.com are required by setup-go's
          # toolchain download (same set repro-check.yml uses) — their absence
          # killed the v3.0.1/v3.0.2 releases at "Set up Go" (ECONNREFUSED).
          # uploads.github.com: goreleaser POSTs release assets there (not
          # api.github.com). No aur.archlinux.org here: package-manager pushes
          # happen in release.yml's publish-packages job AFTER the publish
          # gate; this job only generates the cask/PKGBUILD into dist.
          # raw.githubusercontent.com / get.anchore.io / toolbox-data.anchore.io:
          # the "Install Syft" step (anchore/sbom-action/download-syft) fetches
          # the install script + binary from these (same set grype.yml uses).
          allowed-endpoints: >
            api.github.com:443
            uploads.github.com:443
            codeload.github.com:443
            raw.githubusercontent.com:443
            get.anchore.io:443
            toolbox-data.anchore.io:443
            proxy.golang.org:443
            sum.golang.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            goreleaser.com:443
            go.dev:443
            dl.google.com:443
            storage.googleapis.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            token.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # goreleaser needs full history for changelog

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser (build + SBOM only, no signing)
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin goreleaser's notion of "the tag being released" to the ref that
          # triggered this run. Without it goreleaser derives the tag from git
          # (describe/points-at), which is AMBIGUOUS when several tags point at
          # the same commit — the v4.0.1 run picked v4.0.1-rc.2 (tagged on the
          # same merge commit minutes earlier), rebuilt rc.2, and died with 422
          # already_exists re-uploading to the existing rc.2 release.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # NO tap/AUR credentials here on purpose: .goreleaser.yaml pins
          # skip_upload: true for homebrew_casks and aurs, so this job only
          # GENERATES the cask/PKGBUILD into dist/. release.yml's
          # publish-packages job pushes them AFTER the sign+verify+publish
          # gates, so package managers can never reference a draft or a
          # gate-failed release (see LAUNCH.md §Pre-steps).

      - name: Extract version tag
        id: meta
        # version keeps the leading `v` (e.g. v1.2.3) for release-asset / gh
        # operations; bare strips it (e.g. 1.2.3) for goreleaser artifact names,
        # whose checksum manifest is abysslink_<bare>_checksums.txt.
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "bare=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA L3 provenance for every released artifact
        # subject-checksums points at goreleaser's checksum manifest: the action
        # parses every `<sha256>  <filename>` line and attests EACH listed
        # artifact's digest in a single call (per goreleaser attestations docs),
        # so all tarballs/zips/debs/rpms are covered without listing them.
        # Running inside this reusable workflow is what makes the provenance L3.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/abysslink_${{ steps.meta.outputs.bare }}_checksums.txt

      - name: Upload dist artifacts for subsequent jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          # 7 days (was 1): a sign/verify-only re-run within the week can
          # still download dist instead of failing at download-artifact and
          # forcing a full re-tag.
          retention-days: 7
