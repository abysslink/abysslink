name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  vuln-scan:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: block
          allowed-endpoints: >
            golang.org:443
            proxy.golang.org:443
            sum.golang.org:443
            dl.google.com:443
            go.dev:443
            vuln.go.dev:443
            storage.googleapis.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
          cache: true

      - name: Install govulncheck
        # Pinned (not @latest) — a supply-chain-hardening gate must itself be
        # reproducible and immune to upstream tool compromise. Bump via Dependabot
        # (gomod ecosystem) or a documented manual cadence.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        # Reachability scan: reports vulnerabilities your code actually calls
        # (the actionable set). govulncheck exits non-zero on any such finding.
        # (Module-level scanning, which also surfaces dormant transitive vulns,
        # no longer accepts package patterns in govulncheck v1.3.x.)
        run: govulncheck ./...

  semgrep:
    name: semgrep (OSS ruleset)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: block
          allowed-endpoints: >
            semgrep.dev:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run semgrep
        # Semgrep exits non-zero on any finding. No continue-on-error.
        # returntocorp/semgrep-action was renamed to semgrep/semgrep-action.
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/r2c-security-audit
            p/golang
          generateSarif: "0"

  gosec:
    name: gosec (static security analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: block
          allowed-endpoints: >
            golang.org:443
            proxy.golang.org:443
            sum.golang.org:443
            dl.google.com:443
            go.dev:443
            storage.googleapis.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
          cache: true

      - name: Install gosec
        # Pinned (not @latest) — a supply-chain-hardening gate must itself be
        # reproducible and immune to upstream tool compromise (T-20-01-04). Bump
        # via Dependabot (gomod ecosystem) or a documented manual cadence.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      - name: Run gosec
        # gosec exits non-zero on any unsuppressed finding; no continue-on-error.
        # WR-06: invoke the `security-gosec` make target rather than re-spelling
        # the -exclude flags, so the CI gate and `make lint` share a SINGLE
        # exclude list (Makefile GOSEC_EXCLUDES) that cannot silently drift. The
        # excluded rule families are project-wide verified false-positives /
        # accepted risks, each documented with an inline //nolint justification
        # (SEC-02): G304 file-path-from-variable (internal trusted paths),
        # G101 env-var/keychain-name FPs, G302/G306 executable-binary 0o755,
        # G204 shell.Runner sanctioned exec abstraction (CLAUDE.md). The genuine
        # G115 (signed.go) and G402 (webui doctor probe) carry #nosec annotations.
        run: make security-gosec

  dep-review:
    name: dependency review
    # The dependency-review action compares a PR's base and head refs, so it
    # only runs on pull_request events, not on push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            objects.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency review
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          comment-summary-in-pr: true
