#
# Grype SBOM vulnerability scan with VEX suppression (SUPL-03).
#
# Pipeline (RESEARCH Pattern 3):
#   1. Generate a source SBOM (Syft) so the gate runs on every push/PR — not just
#      at release time. (At release, the goreleaser `sboms:` block emits the
#      authoritative archive SBOMs; this CI gate scans the source tree.)
#   2. govulncheck -format openvex ./...  -> dist/govulncheck.openvex.json
#      (auto, reachability-derived: marks unreachable Go vulns not_affected).
#   3. grype "sbom:<sbom>" --vex dist/govulncheck.openvex.json --vex security/vex
#      --fail-on high  -> High+Critical fail unless VEX-suppressed; Medium is
#      warn-only (Grype default reports but does not fail below --fail-on).
#   4. check-vex-freshness.sh -> fail if any hand-written VEX doc is > 90 days old.
#
# This workflow is intentionally SEPARATE from release.yml (which plan 32-01 owns):
# it is a push/PR CI gate, not part of the draft->publish release sequence.
name: Grype

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly re-scan so CVEs published against unchanged dependencies between
    # commits are still caught (push/PR-only scanning misses them).
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Versions pinned for a reproducible supply-chain gate. Bump via a documented
# manual cadence (the tools that guard the supply chain must themselves be
# immune to upstream drift). grype is installed as a pinned-version host binary
# (verified by tag) rather than via an unpinned action.
env:
  GRYPE_VERSION: "v0.114.0"
  GOVULNCHECK_VERSION: "v1.3.0"

jobs:
  grype:
    name: grype SBOM scan + VEX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            toolbox-data.anchore.io:443
            grype.anchore.io:443
            get.anchore.io:443
            proxy.golang.org:443
            sum.golang.org:443
            golang.org:443
            go.dev:443
            vuln.go.dev:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Prepare dist/ (sbom-action output dir)
        # sbom-action writes output-file: dist/... but does not create the parent
        # dir; without this the SBOM is never written and the Grype step ENOENTs.
        run: mkdir -p dist

      - name: Generate source SBOM (Syft)
        # SHA-pinned anchore/sbom-action (same SHA already used in release-build.yml).
        # Emits an SPDX-JSON SBOM of the source tree as the Grype scan target.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: abysslink-source.spdx.json
          output-file: dist/abysslink-source.spdx.json

      - name: Install govulncheck (pinned)
        # Same pinned version as security.yml — a hardening gate must be reproducible.
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Generate govulncheck-derived OpenVEX (auto, reachability)
        # Reachability-aware: unreachable Go vulns are marked not_affected, so Grype
        # will not fail on them. Regenerated every run => always fresh (not
        # freshness-checked). govulncheck may exit non-zero on a reachable finding;
        # we still want the OpenVEX doc, so do not abort the step on its exit code —
        # the grype --fail-on high step is the authoritative gate.
        run: |
          mkdir -p dist
          govulncheck -format openvex ./... > dist/govulncheck.openvex.json || true
          test -s dist/govulncheck.openvex.json
          echo "govulncheck OpenVEX written:"
          jq '.statements | length' dist/govulncheck.openvex.json

      - name: Install Grype (pinned host binary)
        # Pinned-version install verified by tag from the official anchore script.
        # Preferred over an unpinned grype action; the script + version are auditable.
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" "${GRYPE_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Grype scan with VEX (fail on High+Critical)
        # --vex consumes BOTH the auto govulncheck doc and every hand-written
        # statement in security/vex/. --fail-on high => High+Critical fail unless
        # VEX-suppressed; Medium and below are reported but warn-only.
        run: |
          # grype --vex takes a FILE per flag (not a directory). Pass the auto
          # govulncheck doc plus each hand-written security/vex/*.openvex.json
          # (none today — testdata/ fixtures are excluded by the glob).
          vex_args=(--vex dist/govulncheck.openvex.json)
          shopt -s nullglob
          for f in security/vex/*.openvex.json; do vex_args+=(--vex "$f"); done
          shopt -u nullglob
          echo "VEX docs: ${vex_args[*]}"
          grype "sbom:dist/abysslink-source.spdx.json" \
            "${vex_args[@]}" \
            --fail-on high

      - name: Enforce hand-written VEX 90-day freshness
        run: ./security/vex/check-vex-freshness.sh
