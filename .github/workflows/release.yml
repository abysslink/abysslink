name: Release

on:
  push:
    tags:
      - "v*"

# Workflow-level permissions: deny-all by default; each job grants only what it needs.
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # SLSA Build L3: the build + provenance attestation run in an ISOLATED
  # reusable workflow (release-build.yml). L3 requires id-token+attestations on
  # BOTH the caller (here) AND the reusable job (Pitfall 2). secrets: inherit
  # passes GITHUB_TOKEN through to goreleaser. The reusable workflow surfaces a
  # `version` output so sign/publish keep referencing needs.build.outputs.version
  # unchanged. The previous standalone `attest` (SLSA L2) job has been REMOVED:
  # the reusable workflow now owns provenance via actions/attest-build-provenance,
  # so retaining the old job would emit a duplicate provenance (Pitfall 4).
  build:
    name: Build & SBOM (reusable, SLSA L3)
    uses: ./.github/workflows/release-build.yml
    permissions:
      # write: goreleaser creates the draft release + uploads assets inside the
      # reusable job; the reusable job's own permissions cannot exceed this
      # caller grant. The draft stays private until `publish` flips it.
      contents: write
      id-token: write
      attestations: write
    secrets: inherit

  sign:
    name: Sign (cosign v3 bundle)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write     # upload release assets
      id-token: write     # OIDC token for cosign keyless signing
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # release-assets.githubusercontent.com: cosign-installer downloads the
          # cosign binary from a GitHub release (GitHub's release-asset CDN).
          # uploads.github.com: `gh release upload` of the .bundle assets.
          allowed-endpoints: >
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            oauth2.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Install cosign
        # v4.1.2: cosign v3 dropped the detached .sig/.pem assets in favour of
        # a .sigstore.json bundle. The older installer (v3.8.2) self-verified
        # the downloaded cosign binary against cosign-linux-amd64.sig, which
        # v3.0.6 no longer publishes (404 -> curl exit 22). v4.x verifies via
        # the .sigstore.json bundle instead.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign checksums with cosign v3 bundle
        run: |
          # cosign v3: --bundle produces a self-contained bundle (cert + proof + sig).
          # Offline verification works from the bundle file alone (Pitfall 14 mitigation).
          for checksums_file in dist/*checksums.txt; do
            cosign sign-blob \
              --bundle="${checksums_file}.bundle" \
              --yes \
              "${checksums_file}"
          done

      - name: Upload .bundle files to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.build.outputs.version }}"
          for bundle in dist/*.bundle; do
            gh release upload "${tag}" "${bundle}" --clobber
          done

  verify:
    name: Verify SLSA L3 provenance (gh attestation verify --signer-workflow)
    # Post-build L3 GATE: re-verify the provenance the reusable workflow just
    # produced, binding trust to the exact isolated workflow path. A non-zero
    # exit fails this job, which blocks `publish` — no tampered or
    # wrong-provenance artifact can ever be published. This is the CI half of
    # the same fail-closed contract `abysslink verify`/`upgrade` enforce
    # client-side.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read       # read release assets via the API
      attestations: read   # gh attestation verify fetches the provenance bundle
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # tmaproduction.blob.core.windows.net: `gh attestation verify`
          # downloads the provenance bundle from GitHub's attestations store,
          # which redirects to this Azure blob host (dropped otherwise).
          allowed-endpoints: >
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            github.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Verify provenance for released artifacts
        # gh is pre-installed on ubuntu-latest runners. We verify at least two
        # distinct artifacts (amd64 + arm64) so a provenance gap on either arch
        # fails the gate. --signer-workflow pins trust to release-build.yml; a
        # non-zero exit here blocks publish (fail-closed).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 || { echo "gh CLI not found — cannot verify provenance (fail-closed)"; exit 1; }
          tag="${{ needs.build.outputs.version }}"
          bare="${tag#v}"
          for art in \
            "dist/abysslink_${bare}_linux_amd64.tar.gz" \
            "dist/abysslink_${bare}_linux_arm64.tar.gz" \
            "dist/abysslink_${bare}_darwin_arm64.tar.gz"; do
            echo "::group::verify ${art}"
            gh attestation verify "${art}" \
              --owner abysslink \
              --signer-workflow abysslink/abysslink/.github/workflows/release-build.yml
            echo "::endgroup::"
          done

  publish:
    name: Publish release (gate draft on sign + verify)
    # Only flip the draft to published AFTER the cosign bundle (sign) AND the
    # SLSA L3 provenance verify gate succeed. This guarantees no published
    # release ever exists without its .bundle and independently-verified
    # provenance, closing the partial-signing availability gap (WR-02):
    # install.sh hard-fails when the bundle is missing, so a published-but-
    # unsigned release would be un-installable. Provenance is generated inside
    # the reusable `build` job; `verify` re-checks it before publish.
    needs: [build, sign, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # edit the release to clear the draft flag
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.build.outputs.version }}"
          gh release edit "${tag}" --repo "${{ github.repository }}" --draft=false
