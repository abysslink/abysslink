name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write  # required for cosign OIDC signing (Phase 8)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # goreleaser needs full history for changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        # Phase 8: cosign signing enabled in .goreleaser.yaml

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        # Phase 8: SBOM generation enabled in .goreleaser.yaml

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No COSIGN_PASSWORD needed — using keyless OIDC signing.
