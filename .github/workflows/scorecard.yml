#
# OpenSSF Scorecard — supply-chain security posture analysis. Publishes results
# to the public Scorecard API (api.securityscorecards.dev), which backs the
# README scorecard badge, and uploads SARIF to the GitHub Security tab.
#
# BADGE POLICY (SUPL-02): The README Scorecard badge is added ONLY when the
# published aggregate score is at/above the ~8 threshold. Below ~8 the badge is
# left OUT of the README until the score recovers (a low badge is worse than no
# badge). If a Scorecard badge is currently rendered in README.md while the
# published score is below ~8, remove it until the score is >= 8.
#
# This is a BADGE gate, NOT a CI gate: there is deliberately NO "fail if score < N"
# step here. Several Scorecard checks are structurally low for a solo/auditable
# repo (Branch-Protection, etc.) and external probes (deps.dev, OSV) dip
# transiently — hard-failing CI on the aggregate score would break the build for
# reasons outside a contributor's control. The threshold governs the README badge
# decision only. See SECURITY.md "## OpenSSF Scorecard" for the structurally-low
# checks and their rationale.
#
# The Scorecard score is an INTERNAL quality signal and is NEVER cited in launch,
# marketing, or Show-HN copy (feeds the Phase 33 claims audit; SECURITY.md restates
# this policy).
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, Monday 07:20 UTC.
    - cron: "20 7 * * 1"
  push:
    branches: ["main"]

# Read-all at the top; the analysis job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (OIDC token for the API).
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          # Scorecard probes many endpoints (GitHub API, deps.dev, the OSSF
          # results API); audit mode logs egress without blocking the analysis.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public Scorecard API so the README badge resolves.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b6a472f63d85b9c78a3ac5e89422239fc15e9b3c # v3.28.1
        with:
          sarif_file: results.sarif
