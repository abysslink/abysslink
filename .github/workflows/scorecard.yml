#
# OpenSSF Scorecard — supply-chain security posture analysis. Publishes results
# to the public Scorecard API (api.securityscorecards.dev), which backs the
# README scorecard badge, and uploads SARIF to the GitHub Security tab.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, Monday 07:20 UTC.
    - cron: "20 7 * * 1"
  push:
    branches: ["main"]

# Read-all at the top; the analysis job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (OIDC token for the API).
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          # Scorecard probes many endpoints (GitHub API, deps.dev, the OSSF
          # results API); audit mode logs egress without blocking the analysis.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public Scorecard API so the README badge resolves.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
