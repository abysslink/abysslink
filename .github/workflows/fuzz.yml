name: Fuzz

on:
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly deep run, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

env:
  # GitHub deprecated Node 20 (2026-06-02); force every JS action in this
  # workflow (checkout, setup-go, harden-runner) onto Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fuzz-hmac:
    name: fuzz FuzzHMACVerify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: block
          allowed-endpoints: >
            golang.org:443
            proxy.golang.org:443
            sum.golang.org:443
            dl.google.com:443
            go.dev:443
            storage.googleapis.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: Run FuzzHMACVerify (60s)
        run: go test -fuzz=FuzzHMACVerify -fuzztime=60s -run='^$' ./internal/audit/...

      - name: Scan fuzz corpus for secrets
        # OSS gitleaks CLI (Apache-2.0) instead of gitleaks-action, which
        # paywalls organization repos. Built from source via the module proxy
        # (already in the egress allowlist) — no license, no extra hosts.
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" dir . --no-banner --redact --exit-code 1

  fuzz-config:
    name: fuzz FuzzConfigLoad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: block
          allowed-endpoints: >
            golang.org:443
            proxy.golang.org:443
            sum.golang.org:443
            dl.google.com:443
            go.dev:443
            storage.googleapis.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: Run FuzzConfigLoad (60s)
        run: go test -fuzz=FuzzConfigLoad -fuzztime=60s -run='^$' ./internal/config/...

      - name: Scan fuzz corpus for secrets
        # OSS gitleaks CLI (Apache-2.0) instead of gitleaks-action, which
        # paywalls organization repos. Built from source via the module proxy
        # (already in the egress allowlist) — no license, no extra hosts.
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" dir . --no-banner --redact --exit-code 1

  fuzz-hujson:
    name: fuzz FuzzHuJSONParse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: block
          allowed-endpoints: >
            golang.org:443
            proxy.golang.org:443
            sum.golang.org:443
            dl.google.com:443
            go.dev:443
            storage.googleapis.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: Run FuzzHuJSONParse (60s)
        run: go test -fuzz=FuzzHuJSONParse -fuzztime=60s -run='^$' ./internal/tailscale/...

      - name: Scan fuzz corpus for secrets
        # OSS gitleaks CLI (Apache-2.0) instead of gitleaks-action, which
        # paywalls organization repos. Built from source via the module proxy
        # (already in the egress allowlist) — no license, no extra hosts.
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" dir . --no-banner --redact --exit-code 1
