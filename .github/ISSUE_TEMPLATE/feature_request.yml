---
name: Feature request
description: Suggest an improvement or new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        What hurts today. Describe the concrete situation, not the fix.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Other approaches you thought about, including "do nothing".
  - type: checkboxes
    id: breaking
    attributes:
      label: Breaking change
      options:
        - label: >-
            This would change existing behavior, config schema, or a
            security default.
