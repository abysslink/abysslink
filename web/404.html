<style>
:root{--bg:#0f1117;--fg:#F8F8F2;--muted:#8B95A5;--cyan:#2CE0F5;--violet:#B57BFF;--border:#2a2d3a;color-scheme:dark}
@media (prefers-color-scheme: light){:root{--bg:#FAFBFD;--fg:#101423;--muted:#475569;--cyan:#0E7490;--violet:#7C3AED;--border:#D8DDE7;color-scheme:light}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);min-height:100vh;display:grid;place-items:center;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:center;padding:2rem;
  background-image:repeating-linear-gradient(to bottom, color-mix(in srgb,var(--cyan) 18%,transparent) 0 6px, transparent 6px 30px);
  background-size:2px 100%;background-repeat:no-repeat;background-position:12% 0}
h1{font-size:clamp(3rem,10vw,6rem);letter-spacing:-.04em;
  background:linear-gradient(100deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);margin:.9rem 0 1.8rem}
code{color:var(--cyan)}
a{display:inline-block;color:var(--fg);text-decoration:none;border:1px solid var(--border);
  border-radius:8px;padding:.6rem 1.2rem}
a:hover{border-color:var(--cyan);color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
