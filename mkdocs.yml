site_name: Abysslink
site_description: Paranoid-by-default phone-to-laptop remote setup over Tailscale
site_url: https://abysslink.github.io/abysslink/

repo_name: abysslink/abysslink
repo_url: https://github.com/abysslink/abysslink

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - "Why Abysslink": why-abysslink.md
  - Quickstart: quickstart.md
  - Modules:
    - Tailscale: modules/tailscale.md
    - SSH: modules/ssh.md
    - tmux: modules/tmux.md
    - mosh: modules/mosh.md
    - ntfy: modules/ntfy.md
    - watch: modules/watch.md
    - claudecode: modules/claudecode.md
    - code-server: modules/codeserver.md
    - ttyd: modules/ttyd.md
    - "Eternal Terminal": modules/eternal-terminal.md
    - "Web UI": modules/webui.md
    - "Deferred Modules": modules/deferred-modules.md
  - Reference:
    - Configuration: configuration.md
    - "CLI Reference": cli-reference.md
    - "Push Notifications": push-notifications.md
  - Security:
    - "Security Policy": security.md
    - Threat Model: security/threat-model.md
    - Hardening: security/hardening.md
    - "Agent Safety": agent-safety.md
    - "Claims Audit": claims-audit.md
    - "Who Sees What": who-sees-what.md
    - "Verifying a Release": VERIFYING.md
  - Operations:
    - Troubleshooting: operations/troubleshooting.md
    - FAQ: operations/faq.md
    - Audit evidence: operations/audit-evidence.md
    - "Agent Diary": operations/agent-diary.md
    - "Headscale HA": headscale-ha.md
    - "NetBird SCIM": netbird-scim.md
    - "Fleet Notify Verification": fleet-notify-verification.md
    - "Release Checklist": RELEASE-CHECKLIST.md
  - Testing:
    - "CI Fire Drill": testing/ci-firedrill.md
    - "Push Real-Device Runbook": testing/push-real-device.md
  - Contributing:
    - Contributing: contributing.md
    - "Built with AI": ai-story.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
