#
# gitleaks configuration. Extends the upstream default ruleset and allowlists
# known false positives only. Keep allowlist entries as narrow as possible —
# never allowlist a real secret pattern (e.g. a full tskey-disablement key).

[extend]
useDefault = true

[allowlist]
description = "Abysslink false positives: deliberate test fixtures and git-ignored local scratch dirs"

# .mine/ is git-ignored local scratch (absent from CI checkout); only seen by
# local filesystem scans. Listed so `gitleaks dir .` matches CI behaviour.
#
# internal/notifyv2/testdata/secrets.txt holds deliberate FAKE key=value
# fixtures (hunter22, deadbeefcafe...) that abysslink's OWN secret-scanner
# tests (notifyv2 Validate, conformance audit-log checks) assert are detected;
# gitleaks flagging them blocks every PR that touches the fixture.
paths = [
  '''\.mine/''',
  '''internal/notifyv2/testdata/secrets\.txt''',
  '''internal/notifyv2/validate_test\.go''',
]

# Deliberately fake Tailnet Lock disablement keys used in unit tests. Matched
# by exact suffix so a genuinely random tskey-disablement-* key is NOT exempt.
regexes = [
  '''tskey-disablement-(abc123|def456)''',
]
