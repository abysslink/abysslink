version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - revive
    - gocyclo
    - ineffassign
    - unused
    - staticcheck
    - depguard

linters-settings:
  gocyclo:
    min-complexity: 15
  revive:
    rules:
      - name: exported
        disabled: false
      - name: var-naming
        disabled: false
  gosec:
    excludes:
      - G304  # file path from variable — audit package legitimately reads paths from vars for backup/restore
  depguard:
    rules:
      no-concrete-backend:
        list-mode: lax
        files:
          - "!**/internal/backend/**"
          - "!**/internal/tailscale/**"
        deny:
          - pkg: "github.com/abysslink/abysslink/internal/tailscale"
            desc: "import internal/backend (Client interface) instead — concrete adapters are off-limits outside internal/backend (ROADMAP Phase 11 criterion 4)"
      no-netbird-agpl:
        list-mode: lax
        deny:
          - pkg: "github.com/netbirdio/netbird/management"
            desc: "NetBird management server packages are AGPLv3 — importing them taints the abysslink binary; use REST + net/http only (NB-04)"
          - pkg: "github.com/netbirdio/netbird/combined"
            desc: "NetBird combined server packages are AGPLv3 — same restriction as management (NB-04)"
          - pkg: "github.com/netbirdio/netbird/relay"
            desc: "NetBird relay packages are AGPLv3 (NB-04)"
          - pkg: "github.com/netbirdio/netbird/signal"
            desc: "NetBird signal packages are AGPLv3 (NB-04)"

issues:
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - gosec
      - path: "doc\\.go"
        linters:
          - revive
  max-issues-per-linter: 50
  max-same-issues: 10
